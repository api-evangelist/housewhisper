aid: housewhisper
name: Housewhisper
description: >-
  HouseWhisper (legal name Real Estate Productivity, Inc.) is a Seattle-based AI
  platform for real estate teams and brokerages, founded by former Zillow
  executives. It acts as a 24/7 AI teammate that automates the full lead
  lifecycle through personalized voice and text conversations: a Lead Engine
  that re-engages and revives cold database contacts, a Rules Engine that routes
  leads to the right agent with fallback escalations, and an AI Teammate that
  handles CRM updates, follow-ups, scheduling, reminders, and administrative
  busywork by call or text. It connects to real estate CRM, dialer, and calendar
  systems via API keys with no data migration, integrating with Follow Up Boss,
  Sierra Interactive, kvCORE, MoxiWorks, Salesforce, Lofty, HubSpot, and others.
  Pricing is outcome-based (a small monthly platform fee plus referral fees on
  closed deals). HouseWhisper has raised roughly $10M in seed funding led by
  Mayfield. The company does not currently publish a public developer API,
  documentation, or SDKs.
